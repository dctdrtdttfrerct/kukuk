<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kuku Informacje Rodzinne</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; font-family: Arial; background: #f3f4f6; }
        header { background: #1f2937; color: white; padding: 15px 25px; }
        #panel { padding: 20px; display: none; }
        #loginBox { padding: 20px; }
        .item { background: white; padding: 15px; margin-top: 15px; border-radius: 10px; }
        img { max-width: 600px; border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <h1>Kuku Informacje Rodzinne</h1>
</header>

<div id="loginBox">
    <h2>Zaloguj się</h2>
    <input type="password" id="passwordInput" placeholder="Hasło"><br><br>
    <button onclick="login()">Zaloguj</button>
</div>

<div id="panel">
    <h2>Dodaj zdjęcie i opis</h2>

    <input type="file" id="photoInput"><br><br>
    <input type="text" id="textInput" placeholder="Dodaj opis"><br><br>
    <button onclick="addItem()">Dodaj</button>

    <h2>Wpisy:</h2>
    <div id="items"></div>
</div>

<!-- Firebase 8 (działa globalnie) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script src="script.js"></script>

</body>
</html>
